# The CLI's checks: every pull request, and every push to dev.
#   lint · typecheck · tests (unit; contract: every command against spec/openapi.json; smoke: the built bundle) ·
#   the command table matches spec/openapi.json · the build, which then runs.
# Not here: `npm run e2e`, which needs a real core; the panel's api e2e runs it.
# rimonto-ci:local is the CI's runner image (Node 24).
# Runs on the runner VM, like every check (rm-infra: ops/runner/README.md).
labels:
  pool: runner

when:
  - event: pull_request
  - event: push
    branch: dev
  - event: manual

steps:
  - name: install
    image: rimonto-ci:local
    commands: [npm ci --no-audit --no-fund]

  - name: check
    image: rimonto-ci:local
    commands:
      - npm run check
      # The scripts' tests on node:test, the same files in every repository: lint-ops's (npm run lint runs the linters), and
      # the prepare script's and git's hooks'.
      - node --test scripts/lint-ops.test.mjs scripts/git-hooks.test.mjs
      - node dist/rimonto.js --version
      - node dist/rimonto.js --help > /dev/null

  # Known vulnerabilities in package-lock.json (scripts/osv.mjs, and osv-scanner.toml were there an exception). A step of its
  # own: it asks osv.dev, so a new advisory can fail code nobody touched, and then it says so here.
  - name: known vulnerabilities
    image: rimonto-ci:local
    commands: [node scripts/osv.mjs]

  # A pull request that changes what users get raises the version: its merge into dev publishes it (README, "Releasing").
  - name: version
    image: rimonto-ci:local
    when:
      - event: pull_request
    commands:
      - git fetch -q --unshallow 2> /dev/null || true
      - git fetch -q --no-tags origin "+refs/heads/$${CI_COMMIT_TARGET_BRANCH}:refs/remotes/origin/$${CI_COMMIT_TARGET_BRANCH}"
      - node scripts/version-check.mjs "origin/$${CI_COMMIT_TARGET_BRANCH}"
